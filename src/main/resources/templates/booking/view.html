<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="'Booking #' + ${booking.id}">Booking</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">PhotoBook</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/clients}">Clients</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/photographers}">Photographers</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/packages}">Packages</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/bookings}">Bookings</a></li>
            </ul>
            <a class="btn btn-primary btn-sm" th:href="@{/bookings/new}">New Booking</a>
        </div>
    </div>
</nav>

<main class="container mt-4" style="max-width: 750px;">

    <!-- flash message -->
    <div th:if="${successMsg}" class="alert alert-success">
        <span th:text="${successMsg}"></span>
    </div>

    <a th:href="@{/bookings}" class="btn btn-secondary btn-sm mb-3">Back to Bookings</a>

    <h3>Booking <span th:text="'#' + ${booking.id}"></span></h3>

    <p>
        Status:
        <span class="badge"
              th:classappend="${booking.status.name() == 'PENDING'} ? 'bg-warning text-dark' :
                              (${booking.status.name() == 'CONFIRMED'} ? 'bg-success' :
                              (${booking.status.name() == 'COMPLETED'} ? 'bg-secondary' : 'bg-danger'))"
              th:text="${booking.status}"></span>
    </p>
    <hr>

    <div class="row">
        <div class="col-md-6">
            <h5>Event Details</h5>
            <dl class="row">
                <dt class="col-5">Event Type</dt>
                <dd class="col-7" th:text="${booking.eventType}"></dd>

                <dt class="col-5">Date</dt>
                <dd class="col-7" th:text="${#temporals.format(booking.eventDate, 'dd MMM yyyy')}"></dd>

                <dt class="col-5">Start Time</dt>
                <dd class="col-7"
                    th:text="${booking.eventStartTime != null} ? ${#temporals.format(booking.eventStartTime, 'HH:mm')} : '-'"></dd>

                <dt class="col-5">Location</dt>
                <dd class="col-7" th:text="${booking.eventLocation ?: '-'}"></dd>

                <dt class="col-5">Total Amount</dt>
                <dd class="col-7" th:text="'Rs. ' + ${#numbers.formatDecimal(booking.totalAmount, 1, 'COMMA', 2, 'POINT')}"></dd>

                <dt class="col-5">Booked On</dt>
                <dd class="col-7" th:text="${#temporals.format(booking.createdAt, 'dd MMM yyyy HH:mm')}"></dd>
            </dl>
        </div>

        <div class="col-md-6">
            <h5>Participants</h5>
            <dl class="row">
                <dt class="col-5">Client</dt>
                <dd class="col-7">
                    <a th:href="@{/clients/{id}(id=${booking.client.id})}"
                       th:text="${booking.client.fullName}"></a>
                </dd>

                <dt class="col-5">Photographer</dt>
                <dd class="col-7">
                    <a th:href="@{/photographers/{id}(id=${booking.photographer.id})}"
                       th:text="${booking.photographer.fullName}"></a>
                </dd>

                <dt class="col-5">Package</dt>
                <dd class="col-7">
                    <a th:href="@{/packages/{id}(id=${booking.photographyPackage.id})}"
                       th:text="${booking.photographyPackage.name}"></a>
                </dd>
            </dl>

            <div th:if="${booking.notes}">
                <strong>Notes:</strong>
                <p class="text-muted" th:text="${booking.notes}"></p>
            </div>
        </div>
    </div>

    <hr>

    <!-- edit and delete buttons -->
    <div class="mb-3">
        <a th:href="@{/bookings/{id}/edit(id=${booking.id})}" class="btn btn-primary btn-sm">Edit</a>
        <form th:action="@{/bookings/{id}/delete(id=${booking.id})}" method="post" class="d-inline ms-1"
              onsubmit="return confirm('Delete this booking?')">
            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
        </form>
    </div>

    <!-- update status -->
    <h5>Update Status</h5>
    <form th:action="@{/bookings/{id}/status(id=${booking.id})}" method="post" class="d-flex gap-2">
        <select name="status" class="form-select" style="max-width: 180px;">
            <option th:each="s : ${statuses}"
                    th:value="${s}"
                    th:text="${s}"
                    th:selected="${booking.status == s}"></option>
        </select>
        <button type="submit" class="btn btn-primary">Apply</button>
    </form>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmVA8GK4mIzA9UGq9GYXEKh3G3K"
        crossorigin="anonymous"></script>
</body>
</html>
