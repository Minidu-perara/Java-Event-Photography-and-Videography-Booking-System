<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${booking.id != null} ? 'Edit Booking' : 'New Booking'">Booking Form</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">PhotoBook</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/clients}">Clients</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/photographers}">Photographers</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/packages}">Packages</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/bookings}">Bookings</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container mt-4" style="max-width: 750px;">

    <a th:href="@{/bookings}" class="btn btn-secondary btn-sm mb-3">Back to Bookings</a>

    <h3 th:text="${booking.id != null} ? 'Edit Booking' : 'Create New Booking'">Booking Form</h3>
    <hr>

    <!-- show error if any -->
    <div th:if="${errorMsg}" class="alert alert-danger">
        <span th:text="${errorMsg}"></span>
    </div>

    <!-- warn if no packages exist -->
    <div th:if="${packages != null and #lists.isEmpty(packages)}" class="alert alert-warning">
        No active packages found. <a th:href="@{/packages/new}">Create a package first</a> before making a booking.
    </div>

    <form th:action="${booking.id != null} ? @{/bookings/{id}/edit(id=${booking.id})} : @{/bookings/new}"
          th:object="${booking}" method="post">

        <p><strong>Participants</strong></p>

        <div class="row mb-3">
            <div class="col-md-4">
                <label class="form-label">Client *</label>
                <select name="clientId" class="form-select" required>
                    <option value="">-- Select Client --</option>
                    <option th:each="c : ${clients}"
                            th:value="${c.id}"
                            th:text="${c.fullName}"
                            th:selected="${booking.client != null and booking.client.id == c.id}"></option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Photographer *</label>
                <select name="photographerId" class="form-select" required>
                    <option value="">-- Select Photographer --</option>
                    <option th:each="p : ${photographers}"
                            th:value="${p.id}"
                            th:text="${p.fullName} + ' (' + ${p.specialization} + ')'"
                            th:selected="${booking.photographer != null and booking.photographer.id == p.id}"></option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Package *</label>
                <select name="packageId" class="form-select" required>
                    <option value="">-- Select Package --</option>
                    <option th:each="pk : ${packages}"
                            th:value="${pk.id}"
                            th:text="${pk.name} + ' -- Rs.' + ${#numbers.formatDecimal(pk.price, 1, 'COMMA', 2, 'POINT')}"
                            th:selected="${booking.photographyPackage != null and booking.photographyPackage.id == pk.id}"></option>
                </select>
            </div>
        </div>

        <p><strong>Event Details</strong></p>

        <div class="row mb-3">
            <div class="col-md-4">
                <label class="form-label">Event Type *</label>
                <input type="text" class="form-control" th:field="*{eventType}"
                       placeholder="Wedding, Birthday, etc."/>
                <span th:if="${#fields.hasErrors('eventType')}" th:errors="*{eventType}" class="text-danger small"></span>
            </div>
            <div class="col-md-4">
                <label class="form-label">Event Date *</label>
                <input type="date" class="form-control" th:field="*{eventDate}"/>
                <span th:if="${#fields.hasErrors('eventDate')}" th:errors="*{eventDate}" class="text-danger small"></span>
            </div>
            <div class="col-md-4">
                <label class="form-label">Start Time</label>
                <input type="time" class="form-control" th:field="*{eventStartTime}"/>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Event Location</label>
            <input type="text" class="form-control" th:field="*{eventLocation}" placeholder="Venue or address"/>
        </div>

        <!-- status dropdown only shows when editing existing booking -->
        <div th:if="${booking.id != null}" class="mb-3">
            <label class="form-label">Status</label>
            <select class="form-select" th:field="*{status}" style="max-width: 200px;">
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                        th:selected="${booking.status == s}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Notes</label>
            <textarea class="form-control" th:field="*{notes}" rows="3"
                      placeholder="Any special requests or notes"></textarea>
        </div>

        <hr>
        <button type="submit" class="btn btn-primary">
            <span th:text="${booking.id != null} ? 'Update Booking' : 'Create Booking'">Save</span>
        </button>
        <a th:href="@{/bookings}" class="btn btn-secondary ms-2">Cancel</a>

    </form>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmVA8GK4mIzA9UGq9GYXEKh3G3K"
        crossorigin="anonymous"></script>
</body>
</html>
