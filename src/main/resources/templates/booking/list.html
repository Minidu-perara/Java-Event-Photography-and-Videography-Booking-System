<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bookings</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">PhotoBook</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/clients}">Clients</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/photographers}">Photographers</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/packages}">Packages</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/bookings}">Bookings</a></li>
            </ul>
            <a class="btn btn-primary btn-sm" th:href="@{/bookings/new}">New Booking</a>
        </div>
    </div>
</nav>

<main class="container mt-4">

    <div th:if="${successMsg}" class="alert alert-success">
        <span th:text="${successMsg}"></span>
    </div>

    <div class="d-flex justify-content-between mb-3">
        <h2>Bookings</h2>
        <a th:href="@{/bookings/new}" class="btn btn-primary">New Booking</a>
    </div>

    <!-- filter by status -->
    <div class="mb-3">
        <a th:href="@{/bookings}" class="btn btn-sm"
           th:classappend="${currentStatus == null} ? 'btn-dark' : 'btn-outline-secondary'">All</a>
        <a th:each="s : ${statuses}"
           th:href="@{/bookings(status=${s})}"
           class="btn btn-sm ms-1"
           th:classappend="${currentStatus == s} ? 'btn-dark' : 'btn-outline-secondary'"
           th:text="${s}"></a>
    </div>

    <div th:if="${#lists.isEmpty(bookings)}" class="text-muted">
        No bookings found.
    </div>

    <table th:unless="${#lists.isEmpty(bookings)}" class="table table-bordered table-hover">
        <thead class="table-light">
            <tr>
                <th>#</th>
                <th>Client</th>
                <th>Photographer</th>
                <th>Package</th>
                <th>Event Type</th>
                <th>Date</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="b : ${bookings}">
                <td th:text="${b.id}"></td>
                <td th:text="${b.client.fullName}"></td>
                <td th:text="${b.photographer.fullName}"></td>
                <td th:text="${b.photographyPackage.name}"></td>
                <td th:text="${b.eventType}"></td>
                <td th:text="${#temporals.format(b.eventDate, 'dd MMM yyyy')}"></td>
                <td th:text="'Rs. ' + ${#numbers.formatDecimal(b.totalAmount, 1, 'COMMA', 2, 'POINT')}"></td>
                <td>
                    <span class="badge"
                          th:classappend="${b.status.name() == 'PENDING'} ? 'bg-warning text-dark' :
                                          (${b.status.name() == 'CONFIRMED'} ? 'bg-success' :
                                          (${b.status.name() == 'COMPLETED'} ? 'bg-secondary' : 'bg-danger'))"
                          th:text="${b.status}"></span>
                </td>
                <td>
                    <a th:href="@{/bookings/{id}(id=${b.id})}" class="btn btn-sm btn-primary me-1">View</a>
                    <a th:href="@{/bookings/{id}/edit(id=${b.id})}" class="btn btn-sm btn-secondary me-1">Edit</a>
                    <form th:action="@{/bookings/{id}/delete(id=${b.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Delete this booking?')">
                        <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmVA8GK4mIzA9UGq9GYXEKh3G3K"
        crossorigin="anonymous"></script>
</body>
</html>
