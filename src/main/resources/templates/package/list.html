<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Packages</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">PhotoBook</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/clients}">Clients</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/photographers}">Photographers</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/packages}">Packages</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/bookings}">Bookings</a></li>
            </ul>
            <a class="btn btn-primary btn-sm" th:href="@{/bookings/new}">New Booking</a>
        </div>
    </div>
</nav>

<main class="container mt-4">

    <div th:if="${successMsg}" class="alert alert-success">
        <span th:text="${successMsg}"></span>
    </div>

    <div class="d-flex justify-content-between mb-3">
        <h2>Photography Packages</h2>
        <a th:href="@{/packages/new}" class="btn btn-primary">Add Package</a>
    </div>

    <!-- search -->
    <form th:action="@{/packages}" method="get" class="mb-3">
        <div class="input-group" style="max-width: 400px;">
            <input type="text" name="search" class="form-control"
                   placeholder="Search packages" th:value="${search}"/>
            <button type="submit" class="btn btn-secondary">Search</button>
            <a th:href="@{/packages}" class="btn btn-outline-secondary">Clear</a>
        </div>
    </form>

    <div th:if="${#lists.isEmpty(packages)}" class="text-muted">
        No packages found.
    </div>

    <!-- table instead of cards -->
    <table th:unless="${#lists.isEmpty(packages)}" class="table table-bordered table-hover">
        <thead class="table-light">
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Type</th>
                <th>Price</th>
                <th>Duration</th>
                <th>Max Photos</th>
                <th>Video</th>
                <th>Editing</th>
                <th>Active</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${packages}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.name}"></td>
                <td th:text="${p.packageType}"></td>
                <td th:text="'Rs. ' + ${#numbers.formatDecimal(p.price, 1, 'COMMA', 2, 'POINT')}"></td>
                <td th:text="${p.durationHours} + ' hrs'"></td>
                <td th:text="${p.maxEditedPhotos != null} ? ${p.maxEditedPhotos} : '-'"></td>
                <td>
                    <span th:if="${p.includesVideography}">Yes</span>
                    <span th:unless="${p.includesVideography}">No</span>
                </td>
                <td>
                    <span th:if="${p.includesEditing}">Yes</span>
                    <span th:unless="${p.includesEditing}">No</span>
                </td>
                <td>
                    <span th:if="${p.active}" class="badge bg-success">Active</span>
                    <span th:unless="${p.active}" class="badge bg-secondary">Inactive</span>
                </td>
                <td>
                    <a th:href="@{/packages/{id}(id=${p.id})}" class="btn btn-sm btn-primary me-1">View</a>
                    <a th:href="@{/packages/{id}/edit(id=${p.id})}" class="btn btn-sm btn-secondary me-1">Edit</a>
                    <form th:action="@{/packages/{id}/delete(id=${p.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Delete this package?')">
                        <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmVA8GK4mIzA9UGq9GYXEKh3G3K"
        crossorigin="anonymous"></script>
</body>
</html>
