<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${pkg.name}">Package</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">PhotoBook</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/clients}">Clients</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/photographers}">Photographers</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/packages}">Packages</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/bookings}">Bookings</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container mt-4" style="max-width: 650px;">

    <a th:href="@{/packages}" class="btn btn-secondary btn-sm mb-3">Back to Packages</a>

    <h3 th:text="${pkg.name}">Package Name</h3>
    <hr>

    <dl class="row">
        <dt class="col-sm-4">Type</dt>
        <dd class="col-sm-8" th:text="${pkg.packageType}"></dd>

        <dt class="col-sm-4">Status</dt>
        <dd class="col-sm-8">
            <span th:if="${pkg.active}" class="badge bg-success">Active</span>
            <span th:unless="${pkg.active}" class="badge bg-secondary">Inactive</span>
        </dd>

        <dt class="col-sm-4">Price</dt>
        <dd class="col-sm-8" th:text="'Rs. ' + ${#numbers.formatDecimal(pkg.price, 1, 'COMMA', 2, 'POINT')}"></dd>

        <dt class="col-sm-4">Duration</dt>
        <dd class="col-sm-8" th:text="${pkg.durationHours} + ' hours'"></dd>

        <dt class="col-sm-4">Max Photos</dt>
        <dd class="col-sm-8" th:text="${pkg.maxEditedPhotos != null} ? ${pkg.maxEditedPhotos} : '-'"></dd>

        <dt class="col-sm-4">Includes Videography</dt>
        <dd class="col-sm-8" th:text="${pkg.includesVideography} ? 'Yes' : 'No'"></dd>

        <dt class="col-sm-4">Includes Editing</dt>
        <dd class="col-sm-8" th:text="${pkg.includesEditing} ? 'Yes' : 'No'"></dd>

        <dt class="col-sm-4">Description</dt>
        <dd class="col-sm-8" th:text="${pkg.description ?: '-'}"></dd>
    </dl>

    <div class="mb-3">
        <a th:href="@{/packages/{id}/edit(id=${pkg.id})}" class="btn btn-primary btn-sm">Edit</a>
        <form th:action="@{/packages/{id}/delete(id=${pkg.id})}" method="post" class="d-inline ms-1"
              onsubmit="return confirm('Delete this package?')">
            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
        </form>
        <a th:href="@{/bookings/new}" class="btn btn-secondary btn-sm ms-1">Book This Package</a>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmVA8GK4mIzA9UGq9GYXEKh3G3K"
        crossorigin="anonymous"></script>
</body>
</html>
