<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${pkg.id != null} ? 'Edit Package' : 'New Package'">Package Form</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">PhotoBook</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/clients}">Clients</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/photographers}">Photographers</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/packages}">Packages</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/bookings}">Bookings</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container mt-4" style="max-width: 650px;">

    <a th:href="@{/packages}" class="btn btn-secondary btn-sm mb-3">Back to Packages</a>

    <h3 th:text="${pkg.id != null} ? 'Edit Package' : 'Add New Package'">Package Form</h3>
    <hr>

    <form th:action="${pkg.id != null} ? @{/packages/{id}/edit(id=${pkg.id})} : @{/packages/new}"
          th:object="${pkg}" method="post">

        <div class="mb-3">
            <label class="form-label">Package Name *</label>
            <input type="text" class="form-control" th:field="*{name}"/>
            <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger small"></span>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Package Type *</label>
                <select class="form-select" th:field="*{packageType}">
                    <option th:each="type : ${packageTypes}"
                            th:value="${type}" th:text="${type}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Price (Rs.) *</label>
                <input type="number" step="0.01" min="0" class="form-control" th:field="*{price}"/>
                <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="text-danger small"></span>
            </div>
            <div class="col-md-3">
                <label class="form-label">Duration (hrs) *</label>
                <input type="number" min="1" class="form-control" th:field="*{durationHours}"/>
                <span th:if="${#fields.hasErrors('durationHours')}" th:errors="*{durationHours}" class="text-danger small"></span>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Max Edited Photos</label>
            <input type="number" min="0" class="form-control" th:field="*{maxEditedPhotos}" style="max-width: 200px;"/>
        </div>

        <div class="mb-3 form-check">
            <input class="form-check-input" type="checkbox" th:field="*{includesVideography}" id="inclVideo"/>
            <label class="form-check-label" for="inclVideo">Includes Videography</label>
        </div>
        <div class="mb-3 form-check">
            <input class="form-check-input" type="checkbox" th:field="*{includesEditing}" id="inclEdit"/>
            <label class="form-check-label" for="inclEdit">Includes Editing</label>
        </div>
        <div class="mb-3 form-check">
            <input class="form-check-input" type="checkbox" th:field="*{active}" id="activeFlag"/>
            <label class="form-check-label" for="activeFlag">Active</label>
        </div>

        <hr>
        <button type="submit" class="btn btn-primary">Save</button>
        <a th:href="@{/packages}" class="btn btn-secondary ms-2">Cancel</a>

    </form>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmVA8GK4mIzA9UGq9GYXEKh3G3K"
        crossorigin="anonymous"></script>
</body>
</html>
