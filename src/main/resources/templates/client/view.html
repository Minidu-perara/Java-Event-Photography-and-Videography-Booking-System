<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${client.fullName}">Client</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">PhotoBook</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/clients}">Clients</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/photographers}">Photographers</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/packages}">Packages</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/bookings}">Bookings</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container mt-4" style="max-width: 700px;">

    <a th:href="@{/clients}" class="btn btn-secondary btn-sm mb-3">Back to Clients</a>

    <h3 th:text="${client.fullName}">Client Name</h3>
    <hr>

    <dl class="row">
        <dt class="col-sm-3">Full Name</dt>
        <dd class="col-sm-9" th:text="${client.fullName}"></dd>

        <dt class="col-sm-3">Email</dt>
        <dd class="col-sm-9">
            <a th:href="'mailto:' + ${client.email}" th:text="${client.email}"></a>
        </dd>

        <dt class="col-sm-3">Phone</dt>
        <dd class="col-sm-9" th:text="${client.phone}"></dd>

        <dt class="col-sm-3">Address</dt>
        <dd class="col-sm-9" th:text="${client.address ?: '-'}"></dd>
    </dl>

    <div class="mb-3">
        <a th:href="@{/clients/{id}/edit(id=${client.id})}" class="btn btn-primary btn-sm">Edit</a>
        <form th:action="@{/clients/{id}/delete(id=${client.id})}" method="post" class="d-inline ms-1"
              onsubmit="return confirm('Delete this client?')">
            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
        </form>
    </div>

    <hr>
    <h5>Bookings</h5>

    <div th:if="${#lists.isEmpty(client.bookings)}" class="text-muted">
        No bookings for this client yet.
    </div>

    <table th:unless="${#lists.isEmpty(client.bookings)}" class="table table-bordered table-hover">
        <thead class="table-light">
            <tr>
                <th>#</th>
                <th>Event</th>
                <th>Date</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="b : ${client.bookings}">
                <td th:text="${b.id}"></td>
                <td th:text="${b.eventType}"></td>
                <td th:text="${#temporals.format(b.eventDate, 'dd MMM yyyy')}"></td>
                <td>
                    <span class="badge"
                          th:classappend="${b.status.name() == 'PENDING'} ? 'bg-warning text-dark' :
                                          (${b.status.name() == 'CONFIRMED'} ? 'bg-success' :
                                          (${b.status.name() == 'COMPLETED'} ? 'bg-secondary' : 'bg-danger'))"
                          th:text="${b.status}"></span>
                </td>
                <td>
                    <a th:href="@{/bookings/{id}(id=${b.id})}" class="btn btn-sm btn-primary">View</a>
                </td>
            </tr>
        </tbody>
    </table>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmVA8GK4mIzA9UGq9GYXEKh3G3K"
        crossorigin="anonymous"></script>
</body>
</html>
